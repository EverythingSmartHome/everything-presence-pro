# PHY DIAGNOSTIC BUILD - board revision 1.9a - TEST BUILD, DO NOT SHIP
#
# everything-presence-pro-ethernet-1.9a.yaml plus common/phy-diagnostics.yaml,
# which dumps the LAN8720A registers over MDIO every 5s to explain link
# failures.
#
# PROTOTYPE FIRMWARE - board revision 1.9a
#
# Ethernet-only build for the 1.9a prototype. This board takes its 50MHz RMII
# reference clock from an external oscillator on GPIO0 (clock in), and moves
# the LAN8720A reset / power-enable to GPIO17.
# See common/ethernet-base-1.9a.yaml for the pin map and the boot-mode caveat.
#
# This build uses its own device name so a prototype cannot collide with, or
# be OTA'd from, the production everything-presence-pro devices on the network.
substitutions:
  name: "ep-phydiag-19a"
  friendly_name: "EP PHY Diag 1.9a"
  hidden_ssid: "false"
  factory_reset_disabled: "true"
  uart_target_output_disabled: "true"
  uart_presence_output_disabled: "true"
  log_level: "DEBUG"

  device_config:
    ethernet_enabled: true
    co2_enabled: false
    bluetooth_enabled: false
    board_revision: "1.9a"
    sensor_variant: "ld2450+sen0609"
    firmware_channel: "prototype"
    model: "everything-presence-pro"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

packages:
   pro_base: !include common/everything-presence-pro-base.yaml
   ld2450_base: !include common/ld2450-base.yaml
   sen0609_base: !include common/sen0609-base.yaml
   ethernet_base: !include common/ethernet-base-1.9a.yaml
   phy_diagnostics: !include common/phy-diagnostics.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: True
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(firmware_network).publish_state("Ethernet");
            id(firmware_co2).publish_state("Disabled");
            id(firmware_ble).publish_state("Disabled");

# Prototype channel manifest. Deliberately NOT the production manifest - a
# production (1.8) image drives GPIO17 as a clock output, which on this board
# fights the external oscillator and holds the PHY in reset. The "Apply
# Update" button in the base package still builds production URLs; do not
# press it on a prototype.
update:
  - platform: http_request
    id: update_http_request
    name: Firmware Update
    source: http://docs.everythingsmart.io/update/everything-presence-pro/prototype/everything-presence-pro-ethernet-1.9a-manifest.json
