# Everything Presence Pro - board revision 1.9a (PROTOTYPE)
#
# Difference vs 1.8 (common/ethernet-base.yaml) and 1.9:
#   - The 50MHz RMII reference clock is now generated by an external
#     oscillator and fed INTO the ESP32 on GPIO0 (CLK_EXT_IN). The ESP32 no
#     longer generates the clock.
#   - GPIO17 is now the LAN8720A reset / power-enable line (it also gates the
#     external oscillator, which is what keeps GPIO0 quiet at boot).
#
# GPIO0 is an ESP32 strapping pin. If the external oscillator is already
# running when the chip comes out of reset, GPIO0 is being driven with a
# 50MHz square wave and the strapping sample is effectively random - roughly
# half of all resets land in UART download mode. The design depends on GPIO17
# sitting low (oscillator disabled) until firmware asserts it, so this is the
# revision that most needs the boot-mode soak test.
ethernet:
  id: eth_component
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    # 50MHz from the external oscillator, into the ESP32
    pin: GPIO0
    mode: CLK_EXT_IN
  # LAN8720A reset / power-enable, also gates the external oscillator
  power_pin: GPIO17
  phy_addr: 0
